name: Build APK
on: 
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: |
          ls -la
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n1)
          echo "Found: $ZIP"
          unzip -o "$ZIP" -d src
          ls -la src
      - run: |
          GRADLEW=$(find src -name "gradlew" | head -n1)
          echo "Gradlew at: $GRADLEW"
          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Athanase-APK
          path: "**/build/outputs/apk/debug/*.apk"
