name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip and Build
        run: |
          ls -la
          ZIP=$(find . -name "*.zip" | head -n1)
          if [ -z "$ZIP" ]; then
            echo "❌ Hakuna zip file imepatikana!"
            exit 1
          fi
          echo "📦 Unzipping $ZIP"
          unzip -o "$ZIP" -d project
          cd project
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Athanase-APK
          path: project/**/build/outputs/apk/debug/*.apk
