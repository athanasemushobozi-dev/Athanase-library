name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Find and unzip
        run: |
          ls -la
          ZIPFILE=$(ls *.zip 2>/dev/null | head -n 1)
          echo "Found: $ZIPFILE"
          rm -rf app_project temp_zip
          mkdir temp_zip
          unzip -o "$ZIPFILE" -d temp_zip
          mkdir app_project
          if [ -f temp_zip/gradlew ]; then mv temp_zip/* app_project/ 2>/dev/null; mv temp_zip/.* app_project/ 2>/dev/null || true; else mv temp_zip/*/* app_project/ 2>/dev/null || mv temp_zip/* app_project/ 2>/dev/null || cp -r temp_zip/* app_project/; fi
          ls -la app_project
      - name: Build APK
        run: |
          cd app_project
          chmod +x gradlew
         ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athanase-APK
          path: app_project/app/build/outputs/apk/debug/*.apk
