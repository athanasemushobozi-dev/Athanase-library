name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip and Build
        run: |
          ls -la
          ZIP=$(find . -name "*.zip" | head -n1)
          echo "Unzipping $ZIP"
          unzip -o "$ZIP" -d project
          ls -la project
          GRADLEW=$(find project -name "gradlew" -type f | head -n1)
          echo "Found gradlew at: $GRADLEW"
          chmod +x "$GRADLEW"
          cd $(dirname "$GRADLEW")
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Athanase-APK
          path: "**/build/outputs/apk/debug/*.apk"
